# Standalone production deployment — runs independently of the job-hunter
# bot's own compose stack (different repo, different lifecycle). Only shares
# the VPS host. This file is written by job-hunter-api's deploy.yml only —
# job-hunter-site's deploy.yml pulls/restarts just the `frontend` service
# against whatever is here, it never rewrites the file itself.
# Data bind-mounts the bot's live files from its separate compose project
# (/home/deploy/job-hunter/). tracker.db is rw so PATCH can update
# sent/to_learn; Applications/ stays read-only; candidate/ is rw so the
# web UI can upload templates / personal files into the same tree the bot reads;
# .env is read-only for the Settings page.
services:
  job-hunter-api:
    image: ghcr.io/igrdevelop/job-hunter-api:${IMAGE_TAG:-latest}
    container_name: job-hunter-api
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      APP_DB_PATH: /app/data/app/app.sqlite
      TRACKER_DB_PATH: /app/data/tracker.db
      USERS_ROOT: /app/data/users
      BOT_ENV_PATH: /app/data/.env
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - /home/deploy/job-hunter-web/app-data:/app/data/app
      - /home/deploy/job-hunter/tracker.db:/app/data/tracker.db
      - /home/deploy/job-hunter/users:/app/data/users
      - /home/deploy/job-hunter/.env:/app/data/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ghcr.io/igrdevelop/job-hunter-site:latest
    container_name: job-hunter-frontend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Exposes job-hunter-api and frontend at job-hunter.igrflex.work over
  # Cloudflare Tunnel (dashboard: Zero Trust → Networks → Tunnels →
  # job-hunter-vps), path-routed: /api, /auth → http://job-hunter-api:3000,
  # everything else → http://job-hunter-frontend:80, inside this compose
  # network.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: job-hunter-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
