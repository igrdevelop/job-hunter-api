name: Build and Deploy
# Builds job-hunter-api standalone (backend only — the frontend is built and
# deployed independently by job-hunter-site's own pipeline), pushes to GHCR,
# then deploys to a dedicated directory on the VPS (VPS_WORK_DIR) as its own
# standalone docker-compose project. Completely independent of the
# job-hunter bot's own compose stack/repo.
#
# This workflow is the sole writer of docker-compose.prod.yml on the VPS —
# it includes both the job-hunter-api and frontend service definitions, even
# though this repo only builds/pushes the api image. job-hunter-site's own
# deploy.yml just pulls+restarts the frontend service against the file this
# workflow writes; it never rewrites the file itself.
#
# pull/up are scoped to job-hunter-api + cloudflared only — `docker compose
# pull` aborts the whole command if ANY referenced image can't be resolved,
# so an unscoped pull here would fail (and block backend deploys) whenever
# the frontend image hasn't been pushed yet.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build

  build-and-deploy:
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Read compose file
        if: github.ref == 'refs/heads/master'
        id: compose
        run: |
          {
            echo 'content<<COMPOSE_EOF'
            cat docker-compose.prod.yml
            echo 'COMPOSE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMPOSE_CONTENT
          script: |
            set -e
            cd ${{ secrets.VPS_WORK_DIR }}
            # Write via a temp file and verify it is non-empty before replacing:
            # a full disk once produced an empty compose file that silently broke
            # every later frontend deploy (2026-08-08).
            echo "$COMPOSE_CONTENT" > docker-compose.prod.yml.tmp
            test -s docker-compose.prod.yml.tmp
            cp docker-compose.prod.yml docker-compose.prod.yml.bak 2>/dev/null || true
            mv docker-compose.prod.yml.tmp docker-compose.prod.yml
            cat > .env << EOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SEED_USER_EMAIL=${{ secrets.SEED_USER_EMAIL }}
            SEED_USER_PASSWORD=${{ secrets.SEED_USER_PASSWORD }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            REGISTRATION_ENABLED=${{ vars.REGISTRATION_ENABLED }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            IMAGE_TAG=${{ github.sha }}
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env pull job-hunter-api cloudflared
            docker compose -f docker-compose.prod.yml --env-file .env up -d job-hunter-api cloudflared
            # -a: also remove old tagged images (:sha from previous deploys) —
            # without it they accumulated until the disk filled up (2026-08-08).
            docker image prune -af
        env:
          COMPOSE_CONTENT: ${{ steps.compose.outputs.content }}
